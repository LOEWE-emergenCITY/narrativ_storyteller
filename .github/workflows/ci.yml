name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check .

      - name: Run lint
        run: deno lint .

      - name: Type check
        run: deno check

      - name: Run tests
        run: deno test -A

      - name: Build app
        run: deno task build
