name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Release Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run checks
        run: deno task check

      - name: Run tests
        run: deno test -A

      - name: Build app
        run: deno task build

  deploy-placeholder:
    name: Deploy Placeholder
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Deployment target not configured
        run: |
          cat <<'EOF'
          Deployment skipped.
          No production server or hosting target has been configured yet.
          EOF
