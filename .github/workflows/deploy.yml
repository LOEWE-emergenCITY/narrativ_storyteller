name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            cd /home/deploy/narrativ_storyteller
            git fetch --prune origin "${{ github.ref }}"
            git checkout --detach ${{ github.sha }}

            actual_sha="$(git rev-parse HEAD)"
            test "$actual_sha" = "${{ github.sha }}"

            # Rebuild all source files so changes are not hidden by Docker cache.
            docker compose build --pull --no-cache deno-app
            docker compose up -d --wait --force-recreate --remove-orphans deno-app
